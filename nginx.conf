server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript text/css;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ =404; }
    location /data/ { add_header Cache-Control 'public, max-age=300'; }
    location ~ \.geojson$ {
        default_type application/geo+json;
        add_header Cache-Control 'public, max-age=300';
    }
    location /vendor/ { expires 7d; }
}
